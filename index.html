<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>✨ 별가루 키우기 - 우주 클릭커</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg-deep: #0b0e2a;
    --bg-mid: #151a45;
    --panel: rgba(30, 36, 82, 0.85);
    --panel-light: rgba(58, 66, 130, 0.6);
    --accent: #ffd966;
    --accent-pink: #ff9ecf;
    --accent-mint: #7df3d4;
    --text: #eef0ff;
    --text-dim: #9aa2d8;
  }

  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    background: radial-gradient(ellipse at 50% 30%, var(--bg-mid) 0%, var(--bg-deep) 70%);
    color: var(--text);
    user-select: none;
    -webkit-user-select: none;
  }

  #starfield {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  #game {
    position: relative;
    z-index: 1;
    display: flex;
    height: 100vh;
    height: 100dvh;
  }

  /* ─── 왼쪽: 클릭 영역 ─── */
  #main-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    min-width: 0;
  }

  #stats {
    text-align: center;
    margin-bottom: 8px;
  }

  #stardust-count {
    font-size: clamp(28px, 5vw, 44px);
    font-weight: 800;
    color: var(--accent);
    text-shadow: 0 0 20px rgba(255, 217, 102, 0.5);
    letter-spacing: 1px;
  }

  #sps {
    font-size: 15px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  #click-power-label {
    font-size: 13px;
    color: var(--accent-mint);
    margin-top: 2px;
  }

  #essence-label {
    font-size: 13px;
    font-weight: 700;
    color: var(--accent-pink);
    margin-top: 2px;
  }

  #stage-label {
    font-size: 13px;
    font-weight: 700;
    color: #8ab6ff;
    margin-top: 4px;
    cursor: pointer;
  }

  #stage-label:hover { text-decoration: underline; }

  /* ─── 지도 탭 ─── */
  .stage-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel-light);
    border: 2px solid transparent;
    border-radius: 14px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }

  .stage-item.cleared { opacity: 0.6; }
  .stage-item.current { border-color: var(--accent); }
  .stage-item.locked-stage { opacity: 0.4; filter: grayscale(0.7); }

  .stage-bar {
    height: 10px;
    background: rgba(11, 14, 42, 0.6);
    border-radius: 999px;
    overflow: hidden;
    margin: 6px 0 4px;
  }

  .stage-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-mint), var(--accent));
    border-radius: 999px;
    transition: width 0.3s;
  }

  .stage-go {
    border: none;
    background: linear-gradient(135deg, var(--accent), #ffb347);
    color: #3a2c00;
    font-weight: 800;
    font-family: inherit;
    font-size: 13px;
    padding: 9px 14px;
    border-radius: 999px;
    cursor: pointer;
    flex-shrink: 0;
    animation: nova-glow 2s ease-in-out infinite;
    transition: transform 0.1s;
  }

  .stage-go:active { transform: scale(0.94); }

  /* ─── 기록 탭 ─── */
  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 14px;
  }

  .stat-card {
    background: var(--panel-light);
    border-radius: 12px;
    padding: 10px 12px;
  }

  .stat-name { font-size: 11px; color: var(--text-dim); margin-bottom: 3px; }
  .stat-val { font-size: 15px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }

  .records-title {
    font-size: 13px;
    font-weight: 800;
    color: var(--text-dim);
    margin: 6px 2px 8px;
  }

  .ach-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel-light);
    border: 2px solid transparent;
    border-radius: 14px;
    padding: 9px 12px;
    margin-bottom: 8px;
  }

  .ach-item.earned { border-color: var(--accent-mint); }
  .ach-item.locked-ach { opacity: 0.45; filter: grayscale(0.7); }

  #btn-supernova {
    margin-top: 10px;
    background: linear-gradient(135deg, var(--accent-pink), var(--accent));
    border: none;
    color: #5b1e3e;
    font-weight: 800;
    font-size: 14px;
    padding: 10px 22px;
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 0 18px rgba(255, 158, 207, 0.55);
    animation: nova-glow 2s ease-in-out infinite;
    transition: transform 0.1s;
  }

  @keyframes nova-glow {
    0%, 100% { box-shadow: 0 0 10px rgba(255, 158, 207, 0.4); }
    50% { box-shadow: 0 0 26px rgba(255, 217, 102, 0.9); }
  }

  #btn-supernova:active { transform: scale(0.94); }

  /* ─── 명언 ─── */
  #quote {
    position: absolute;
    bottom: 58px;
    left: 50%;
    transform: translateX(-50%);
    max-width: min(78%, 440px);
    text-align: center;
    font-size: 13.5px;
    font-style: italic;
    line-height: 1.65;
    color: var(--text-dim);
    text-shadow: 0 0 12px rgba(255, 255, 255, 0.12);
    opacity: 0;
    transition: opacity 1.2s ease;
    pointer-events: none;
    z-index: 3;
  }

  #quote.show { opacity: 1; }

  #quote .quote-by {
    display: block;
    margin-top: 4px;
    font-size: 11.5px;
    font-style: normal;
    color: var(--accent);
    opacity: 0.85;
  }

  @media (max-width: 640px) {
    #quote { bottom: 10px; font-size: 12px; }
  }

  /* 골든 혜성 */
  .meteor {
    position: absolute;
    font-size: 38px;
    z-index: 6;
    cursor: pointer;
    filter: drop-shadow(0 0 14px #ffd966) drop-shadow(0 0 4px #fff);
    transition: left 7s linear, top 7s linear;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ─── 별 캐릭터 ─── */
  #star-wrap {
    position: relative;
    width: min(300px, 60vw);
    height: min(300px, 60vw);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  #star-glow {
    position: absolute;
    inset: 10%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 217, 102, 0.35) 0%, transparent 70%);
    animation: pulse 3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.8; }
    50% { transform: scale(1.15); opacity: 1; }
  }

  #star-char {
    width: 72%;
    height: 72%;
    transition: transform 0.08s ease;
    filter: drop-shadow(0 0 25px rgba(255, 217, 102, 0.45));
    animation: float 4s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { translate: 0 -8px; }
    50% { translate: 0 8px; }
  }

  #star-wrap:active #star-char { transform: scale(0.88); }
  #star-wrap.bounce #star-char { transform: scale(0.88); }

  /* 클릭 파티클 */
  .pop {
    position: absolute;
    font-weight: 800;
    color: var(--accent);
    text-shadow: 0 0 8px rgba(255, 217, 102, 0.8);
    pointer-events: none;
    animation: popup 0.9s ease-out forwards;
    font-size: 20px;
    z-index: 5;
  }

  @keyframes popup {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-70px) scale(1.3); }
  }

  .sparkle {
    position: absolute;
    pointer-events: none;
    font-size: 16px;
    animation: sparkfly 0.8s ease-out forwards;
    z-index: 4;
  }

  @keyframes sparkfly {
    0% { opacity: 1; transform: translate(0, 0) scale(1) rotate(0deg); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.3) rotate(180deg); }
  }

  /* 떠다니는 친구들 */
  .friend {
    position: absolute;
    font-size: 28px;
    pointer-events: none;
    animation: orbit-float 6s ease-in-out infinite;
    filter: drop-shadow(0 0 6px rgba(255,255,255,0.3));
  }

  @keyframes orbit-float {
    0%, 100% { translate: 0 -10px; }
    50% { translate: 0 10px; }
  }

  /* ─── 오른쪽: 상점 패널 ─── */
  #shop {
    width: 340px;
    max-width: 45vw;
    background: var(--panel);
    backdrop-filter: blur(8px);
    border-left: 2px solid rgba(255, 255, 255, 0.08);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #shop-tabs {
    display: flex;
    border-bottom: 2px solid rgba(255, 255, 255, 0.08);
  }

  .tab {
    flex: 1;
    padding: 13px 6px;
    text-align: center;
    font-size: 14px;
    font-weight: 700;
    color: var(--text-dim);
    cursor: pointer;
    background: transparent;
    border: none;
    font-family: inherit;
    transition: color 0.15s, background 0.15s;
  }

  .tab.active {
    color: var(--accent);
    background: rgba(255, 217, 102, 0.08);
    box-shadow: inset 0 -3px 0 var(--accent);
  }

  #shop-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    scrollbar-width: thin;
    scrollbar-color: var(--panel-light) transparent;
  }

  .item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel-light);
    border: 2px solid transparent;
    border-radius: 14px;
    padding: 10px 12px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: transform 0.1s, border-color 0.15s, opacity 0.2s;
    width: 100%;
    font-family: inherit;
    color: var(--text);
    text-align: left;
  }

  .item:not(.locked):hover { border-color: var(--accent); transform: translateX(-3px); }
  .item:not(.locked):active { transform: scale(0.97); }

  .item.locked { opacity: 0.45; cursor: default; filter: grayscale(0.6); }
  .item.hidden-item { display: none; }

  .item-icon {
    font-size: 30px;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(11, 14, 42, 0.5);
    border-radius: 11px;
    flex-shrink: 0;
  }

  .item-info { flex: 1; min-width: 0; }

  .item-name { font-size: 14px; font-weight: 700; }
  .item-name .owned { color: var(--accent-mint); font-weight: 800; margin-left: 4px; }

  .item-desc { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }

  .item-cost {
    font-size: 13px;
    font-weight: 800;
    color: var(--accent);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .item-cost.too-expensive { color: #ff7b7b; }

  .item.upgrade-bought { border-color: var(--accent-mint); opacity: 0.55; cursor: default; }
  .item.upgrade-bought .item-cost { color: var(--accent-mint); }

  /* ─── 토스트 ─── */
  #toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%) translateY(20px);
    background: var(--panel);
    border: 2px solid var(--accent);
    color: var(--text);
    padding: 12px 22px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 700;
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    pointer-events: none;
    z-index: 50;
    max-width: 90vw;
    text-align: center;
  }

  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ─── 오프라인 보상 모달 ─── */
  #modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(5, 7, 24, 0.75);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }

  #modal-overlay.show { display: flex; }

  #modal {
    background: var(--panel);
    border: 2px solid var(--accent);
    border-radius: 22px;
    padding: 30px 34px;
    text-align: center;
    max-width: 320px;
    animation: modal-in 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes modal-in {
    from { transform: scale(0.7); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  #modal .big-emoji { font-size: 52px; margin-bottom: 8px; }
  #modal h2 { font-size: 19px; margin-bottom: 8px; }
  #modal p { font-size: 14px; color: var(--text-dim); line-height: 1.6; }
  #modal .reward { color: var(--accent); font-weight: 800; font-size: 18px; }

  #modal button {
    margin-top: 18px;
    background: linear-gradient(135deg, var(--accent), #ffb347);
    border: none;
    color: #3a2c00;
    font-weight: 800;
    font-size: 15px;
    padding: 11px 34px;
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.1s;
  }

  #modal button:active { transform: scale(0.94); }

  /* ─── 백업/복원 모달 ─── */
  #io-overlay {
    position: fixed;
    inset: 0;
    background: rgba(5, 7, 24, 0.75);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }

  #io-overlay.show { display: flex; }

  #io-modal {
    background: var(--panel);
    border: 2px solid var(--accent-mint);
    border-radius: 22px;
    padding: 26px 28px;
    text-align: center;
    width: min(420px, 92vw);
    animation: modal-in 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  #io-modal h2 { font-size: 18px; margin-bottom: 6px; }
  #io-modal p { font-size: 12.5px; color: var(--text-dim); line-height: 1.6; margin-bottom: 12px; }

  #io-code {
    width: 100%;
    height: 110px;
    background: rgba(11, 14, 42, 0.7);
    border: 1.5px solid rgba(255, 255, 255, 0.15);
    border-radius: 12px;
    color: var(--accent-mint);
    font-family: monospace;
    font-size: 11px;
    padding: 10px;
    resize: none;
    word-break: break-all;
  }

  #io-code:focus { outline: none; border-color: var(--accent-mint); }

  #io-buttons { display: flex; gap: 8px; justify-content: center; margin-top: 14px; }

  #io-buttons button {
    border: none;
    font-weight: 800;
    font-size: 14px;
    padding: 10px 22px;
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.1s;
  }

  #io-buttons button:active { transform: scale(0.94); }

  #io-primary { background: linear-gradient(135deg, var(--accent-mint), #4dd6b0); color: #00382a; }
  #io-cancel { background: var(--panel-light); color: var(--text); }

  /* ─── 클라우드 동기화 모달 ─── */
  #cloud-overlay {
    position: fixed;
    inset: 0;
    background: rgba(5, 7, 24, 0.75);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }

  #cloud-overlay.show { display: flex; }

  #cloud-modal {
    background: var(--panel);
    border: 2px solid #8ab6ff;
    border-radius: 22px;
    padding: 26px 28px;
    width: min(430px, 92vw);
    max-height: 90vh;
    overflow-y: auto;
    animation: modal-in 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  #cloud-modal h2 { font-size: 18px; margin-bottom: 6px; text-align: center; }
  #cloud-modal .cloud-hint { font-size: 12px; color: var(--text-dim); line-height: 1.6; text-align: center; margin-bottom: 14px; }
  #cloud-modal .cloud-hint a { color: #8ab6ff; }

  .cloud-field { margin-bottom: 10px; }
  .cloud-field label { display: block; font-size: 12px; font-weight: 700; color: var(--text-dim); margin-bottom: 4px; }

  .cloud-field input {
    width: 100%;
    background: rgba(11, 14, 42, 0.7);
    border: 1.5px solid rgba(255, 255, 255, 0.15);
    border-radius: 10px;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    padding: 9px 12px;
  }

  .cloud-field input:focus { outline: none; border-color: #8ab6ff; }

  #cloud-auto-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-dim);
    margin: 4px 0 12px;
    cursor: pointer;
  }

  #cloud-auto-row input { accent-color: #8ab6ff; width: 16px; height: 16px; cursor: pointer; }

  #cloud-status {
    font-size: 12.5px;
    text-align: center;
    min-height: 18px;
    margin-bottom: 10px;
    color: var(--accent-mint);
  }

  #cloud-status.err { color: #ff7b7b; }

  #cloud-buttons { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

  #cloud-buttons button {
    border: none;
    font-weight: 800;
    font-size: 13.5px;
    padding: 10px 18px;
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.1s, opacity 0.15s;
  }

  #cloud-buttons button:active { transform: scale(0.94); }
  #cloud-buttons button:disabled { opacity: 0.5; cursor: default; }

  #cloud-upload { background: linear-gradient(135deg, #8ab6ff, #5d8ef7); color: #06214d; }
  #cloud-download { background: linear-gradient(135deg, var(--accent-mint), #4dd6b0); color: #00382a; }
  #cloud-close { background: var(--panel-light); color: var(--text); }

  /* ─── 하단 유틸 바 ─── */
  #util-bar {
    position: absolute;
    bottom: 12px;
    left: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    z-index: 10;
  }

  .util-btn {
    background: var(--panel);
    border: 1.5px solid rgba(255, 255, 255, 0.15);
    color: var(--text-dim);
    font-size: 12px;
    font-weight: 700;
    padding: 7px 13px;
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;
    transition: color 0.15s, border-color 0.15s;
  }

  .util-btn:hover { color: var(--text); border-color: var(--accent); }

  /* ─── 모바일 세로 레이아웃 ─── */
  @media (max-width: 640px) {
    #game { flex-direction: column; }
    #main-area { flex: 1 1 48%; min-height: 0; padding-top: 46px; }
    #star-wrap { width: min(210px, 52vw); height: min(210px, 52vw); }
    .util-btn { font-size: 14px; padding: 5px 10px; }
    .util-btn .btn-label { display: none; }
    #shop {
      width: 100%;
      max-width: 100%;
      flex: 1 1 52%;
      min-height: 0;
      border-left: none;
      border-top: 2px solid rgba(255, 255, 255, 0.08);
    }
    #util-bar { top: 10px; bottom: auto; }
  }
</style>
</head>
<body>
<canvas id="starfield"></canvas>

<div id="game">
  <div id="main-area">
    <div id="stats">
      <div id="stardust-count">0</div>
      <div id="sps">✨ 초당 0 별가루</div>
      <div id="click-power-label">👆 클릭당 +1</div>
      <div id="essence-label" style="display:none"></div>
      <div id="stage-label" title="지도 보기"></div>
      <button id="btn-supernova" style="display:none"></button>
    </div>

    <div id="star-wrap" title="별을 콕콕 눌러줘!">
      <div id="star-glow"></div>
      <svg id="star-char" viewBox="0 0 200 200">
        <!-- 별 몸통 -->
        <path d="M100 8 L124 68 L188 74 L140 118 L154 182 L100 148 L46 182 L60 118 L12 74 L76 68 Z"
              fill="#ffd966" stroke="#f0b429" stroke-width="5" stroke-linejoin="round"/>
        <!-- 볼터치 -->
        <ellipse cx="66" cy="106" rx="11" ry="7" fill="#ffb0c8" opacity="0.85"/>
        <ellipse cx="134" cy="106" rx="11" ry="7" fill="#ffb0c8" opacity="0.85"/>
        <!-- 눈 -->
        <g id="eyes-open">
          <circle cx="76" cy="92" r="8" fill="#3a2c00"/>
          <circle cx="124" cy="92" r="8" fill="#3a2c00"/>
          <circle cx="79" cy="89" r="3" fill="#fff"/>
          <circle cx="127" cy="89" r="3" fill="#fff"/>
        </g>
        <g id="eyes-happy" style="display:none">
          <path d="M68 92 Q76 84 84 92" stroke="#3a2c00" stroke-width="5" fill="none" stroke-linecap="round"/>
          <path d="M116 92 Q124 84 132 92" stroke="#3a2c00" stroke-width="5" fill="none" stroke-linecap="round"/>
        </g>
        <!-- 입 -->
        <path id="mouth" d="M90 112 Q100 122 110 112" stroke="#3a2c00" stroke-width="5" fill="none" stroke-linecap="round"/>
      </svg>
    </div>

    <div id="quote"></div>

    <div id="util-bar">
      <button class="util-btn" id="btn-save">💾<span class="btn-label"> 저장</span></button>
      <button class="util-btn" id="btn-export">📤<span class="btn-label"> 백업</span></button>
      <button class="util-btn" id="btn-import">📥<span class="btn-label"> 복원</span></button>

    icon: MYST_ICONS[k % MYST_ICONS.length],

}

/* ════════════════ 상태 ════════════════ */

const SAVE_KEY = 'stardust-idle-save-v1';

function freshState() {
  const owned = {};
  BUILDINGS.forEach(b => owned[b.id] = 0);
  return {
    stardust: 0,
    totalEarned: 0,
    totalClicks: 0,
    owned,
    upgrades: [],
    essence: 0,
    resets: 0,
    stage: 0,
    stageEarned: 0,
    achievements: [],
    meteorsCaught: 0,
    playTime: 0,
    lifetimeEarned: 0,
    lastTick: Date.now(),
  };
}

let S = freshState();

// 별가루 획득 공통 경로 (스테이지 진행도·평생 누적에 함께 반영)
function earn(n) {
  S.stardust += n;
  S.totalEarned += n;
  S.stageEarned += n;
  S.lifetimeEarned += n;
}

function totalOwned(s) {
  return Object.values(s.owned).reduce((a, b) => a + b, 0);
}

/* ════════════════ 계산 ════════════════ */

function buildingMult(id) {
  let m = 1;
  for (const uid of S.upgrades) {
    const u = UPGRADES.find(x => x.id === uid);
    if (!u) continue;
    if (u.type === 'building' && u.target === id) m *= u.mult;
    if (u.type === 'global') m *= u.mult;
  }
  return m;
}

function essenceMult() {
  return 1 + (S.essence || 0) * 0.02;
}

function clickPower() {
  let p = 1;
  for (const uid of S.upgrades) {
    const u = UPGRADES.find(x => x.id === uid);
    if (u && u.type === 'click') p *= u.mult;
  }
  // 초당 생산량의 1%도 클릭에 보태줘요 (후반 클릭 재미 유지)
  return p * essenceMult() + totalSps() * 0.01;
}

function totalSps() {
  let sum = 0;
  for (const b of BUILDINGS) {
    sum += b.sps * S.owned[b.id] * buildingMult(b.id);
  }
  return sum * essenceMult() * stageMult() * achMult();
}

/* ════════════════ 효과음 (WebAudio, 파일 없이 합성) ════════════════ */

const SOUND_KEY = 'stardust-idle-sound-v1';
let soundOn = localStorage.getItem(SOUND_KEY) !== '0';
let audioCtx = null;

function ac() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  } catch (e) { return null; }
}

function tone(freq, dur, opt = {}) {
  const ctx = ac();
  if (!ctx) return;
  const t0 = ctx.currentTime + (opt.delay || 0);
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = opt.type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  if (opt.slide) o.frequency.exponentialRampToValueAtTime(opt.slide, t0 + dur);
  g.gain.setValueAtTime(opt.vol || 0.12, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g).connect(ctx.destination);
  o.start(t0);
  o.stop(t0 + dur + 0.05);
}

function sfx(kind) {
  if (!soundOn) return;
  switch (kind) {
    case 'click':  tone(520 + Math.random() * 120, 0.07, { type: 'triangle', vol: 0.05 }); break;
    case 'buy':    tone(440, 0.09, { vol: 0.09 }); tone(660, 0.12, { delay: 0.08, vol: 0.09 }); break;
    case 'meteor': tone(1400, 0.35, { slide: 300, vol: 0.11 }); tone(2000, 0.2, { delay: 0.05, slide: 900, vol: 0.05 }); break;
    case 'stage':  [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.14, { delay: i * 0.09, vol: 0.09 })); break;
    case 'nova':   tone(220, 0.7, { type: 'sawtooth', slide: 55, vol: 0.12 }); tone(880, 0.5, { delay: 0.1, slide: 1760, vol: 0.05 }); break;
    case 'ach':    [660, 880, 1320].forEach((f, i) => tone(f, 0.12, { delay: i * 0.08, vol: 0.09 })); break;
  }
}

// 초신성 폭발 시 얻는 별의 정수 (이번 생의 누적 획득량 기준)
function supernovaGain() {
  return Math.floor(Math.sqrt(S.totalEarned / 1e6));
}

function buildingCost(b) {
  return Math.ceil(b.baseCost * Math.pow(1.15, S.owned[b.id]));
}

/* ════════════════ 숫자 표기 (한국식) ════════════════ */

const UNITS = [
  { v: 1e16, s: '경' },
  { v: 1e12, s: '조' },
  { v: 1e8,  s: '억' },
  { v: 1e4,  s: '만' },
];

function fmt(n) {
  if (n < 0) return '0';
  if (n < 1000) return (Math.floor(n * 10) / 10).toString().replace(/\.0$/, '');
  for (const u of UNITS) {
    if (n >= u.v) {
      const val = n / u.v;
      return (val >= 100 ? Math.floor(val) : Math.floor(val * 10) / 10) + u.s;
    }
  }
  return Math.floor(n).toLocaleString('ko-KR');
}

function renderShop() {
  $shopList.innerHTML = '';
  if (activeTab === 'buildings') {
    let prevOwnedOrVisible = true;
    for (let i = 0; i < BUILDINGS.length; i++) {
      const b = BUILDINGS[i];
      // 이전 건물을 하나라도 갖고 있거나, 살 수 있을 만큼 모은 적 있으면 노출
      const visible = i === 0 || S.owned[BUILDINGS[i-1].id] > 0 || S.totalEarned >= b.baseCost * 0.5;
      if (!visible) { break; }
      const cost = buildingCost(b);
      const canBuy = S.stardust >= cost;
      const btn = document.createElement('button');
      btn.className = 'item' + (canBuy ? '' : ' locked');
      btn.dataset.buy = b.id;
      btn.innerHTML = `
        <div class="item-icon">${b.icon}</div>
        <div class="item-info">
          <div class="item-name">${b.name}<span class="owned">${S.owned[b.id] > 0 ? '×' + S.owned[b.id] : ''}</span></div>
          <div class="item-desc">${b.desc}<br>초당 +${fmt(b.sps * buildingMult(b.id))}</div>
        </div>
        <div class="item-cost ${canBuy ? '' : 'too-expensive'}">✨${fmt(cost)}</div>`;
      $shopList.appendChild(btn);
    }
  } else if (activeTab === 'upgrades') {
    let shown = 0;
    for (const u of UPGRADES) {
      const bought = S.upgrades.includes(u.id);
      if (!bought && !u.unlock(S)) continue;
      shown++;
      const canBuy = !bought && S.stardust >= u.cost;
      const btn = document.createElement('button');
      btn.className = 'item' + (bought ? ' upgrade-bought' : canBuy ? '' : ' locked');
      if (!bought) btn.dataset.upgrade = u.id;
      btn.innerHTML = `
        <div class="item-icon">${u.icon}</div>
        <div class="item-info">
          <div class="item-name">${u.name}</div>
          <div class="item-desc">${u.desc}</div>
        </div>
        <div class="item-cost ${bought ? '' : canBuy ? '' : 'too-expensive'}">${bought ? '완료!' : '✨' + fmt(u.cost)}</div>`;
      $shopList.appendChild(btn);
    }
    if (shown === 0) {
      const p = document.createElement('div');
      p.style.cssText = 'text-align:center;color:var(--text-dim);padding:30px 10px;font-size:13px;line-height:1.7';
      p.innerHTML = '아직 업그레이드가 없어요!<br>별을 더 클릭하고 시설을 모아보세요 🌟';

    }

    renderMap();
  } else if (activeTab === 'records') {
    renderRecords();
  }
}

      div.innerHTML = `

$shopList.addEventListener('click', e => {
  if (e.target.closest('[data-go]')) { advanceStage(); return; }
  const btn = e.target.closest('.item');
  if (!btn) return;
  if (btn.dataset.buy) {
    const b = BUILDINGS.find(x => x.id === btn.dataset.buy);
    const cost = buildingCost(b);
    if (S.stardust < cost) return;
    S.stardust -= cost;
    S.owned[b.id]++;
    toast(`${b.icon} ${b.name} 획득! (${S.owned[b.id]}개)`);
    sfx('buy');
    happyFace();
    renderShop();
  } else if (btn.dataset.upgrade) {
    const u = UPGRADES.find(x => x.id === btn.dataset.upgrade);
    if (S.upgrades.includes(u.id) || S.stardust < u.cost) return;
    S.stardust -= u.cost;
    S.upgrades.push(u.id);
    toast(`${u.icon} ${u.name} 구매! ${u.desc}`);
    sfx('buy');
    happyFace();
    renderShop();
  }
});

function refreshShopAffordability() {
  $shopList.querySelectorAll('.item').forEach(btn => {
    let cost = null;
    if (btn.dataset.buy) {
      cost = buildingCost(BUILDINGS.find(x => x.id === btn.dataset.buy));
    } else if (btn.dataset.upgrade) {
      cost = UPGRADES.find(x => x.id === btn.dataset.upgrade).cost;
    }
    if (cost === null) return;
    const can = S.stardust >= cost;
    btn.classList.toggle('locked', !can);
    const costEl = btn.querySelector('.item-cost');
    if (costEl) costEl.classList.toggle('too-expensive', !can);
  });
}

/* ════════════════ 떠다니는 친구들 (보유 시설 표시) ════════════════ */

const friendEls = new Map();

// 별 중심 타원 궤도의 좌·우 호에만 슬롯 배치
// (위쪽은 별가루 카운터, 아래쪽은 명언 영역이라 비워둠)
function positionFriends() {
  const areaRect = $mainArea.getBoundingClientRect();
  const starRect = $starWrap.getBoundingClientRect();
  const cx = starRect.left - areaRect.left + starRect.width / 2;
  const cy = starRect.top - areaRect.top + starRect.height / 2;
  // 좌우로 넓고 위아래로 납작한 타원: 위 텍스트·아래 명언·별 본체를 모두 피함
  const rx = Math.min(starRect.width * 0.85, areaRect.width / 2 - 34);
  const ry = starRect.height * 0.55;
  let i = 0;
  for (const b of BUILDINGS) {
    const el = friendEls.get(b.id);
    if (!el) continue;
    const side = i % 2;              // 오른쪽/왼쪽 호 번갈아
    const k = Math.floor(i / 2);     // 호 안에서의 순번 (최대 7개씩)
    const deg = side === 0 ? (-35 + k * 11.7) : (145 + k * 11.7);
    const rad = deg * Math.PI / 180;
    el.style.left = (cx + Math.cos(rad) * rx - 14) + 'px';
    el.style.top = (cy + Math.sin(rad) * ry - 14) + 'px';
    i++;
  }
}

function updateFriends() {
  let added = false;
  for (const b of BUILDINGS) {
    const has = S.owned[b.id] > 0;
    if (has && !friendEls.has(b.id)) {
      const el = document.createElement('div');
      el.className = 'friend';
      el.textContent = b.icon;
      el.style.animationDelay = (Math.random() * 4) + 's';
      el.style.animationDuration = (5 + Math.random() * 3) + 's';
      $mainArea.appendChild(el);
      friendEls.set(b.id, el);
      added = true;
    }
  }
  if (added) positionFriends();
}

window.addEventListener('resize', positionFriends);

function spawnMeteor() {

  const m = document.createElement('div');

  const H = $mainArea.clientHeight;
  const fromLeft = Math.random() < 0.5;

  m.style.top = H * (0.08 + Math.random() * 0.3) + 'px';

const canvas = document.getElementById('starfield');
const ctx = canvas.getContext('2d');
let bgStars = [];

function initStarfield() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  bgStars = Array.from({ length: 90 }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 1.6 + 0.4,
    tw: Math.random() * Math.PI * 2,
    speed: 0.4 + Math.random() * 1.2,
  }));
}

function drawStarfield(t) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (const s of bgStars) {
    const a = 0.35 + 0.55 * Math.abs(Math.sin(t / 1000 * s.speed + s.tw));
    ctx.globalAlpha = a;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

window.addEventListener('resize', initStarfield);

/* ════════════════ 게임 루프 ════════════════ */

let lastFrame = performance.now();
let shopDirtyTimer = 0;

function loop(now) {
  const dt = Math.min((now - lastFrame) / 1000, 1);
  lastFrame = now;

  const gain = totalSps() * dt;
  if (gain > 0) earn(gain);
  S.playTime += dt;

  updateStats();
  drawStarfield(now);
  updateFriends();

  // 상점 잠금 상태는 0.25초마다 갱신 (매 프레임 DOM 조작 최소화)
  shopDirtyTimer += dt;
  if (shopDirtyTimer > 0.25) {
    shopDirtyTimer = 0;
    checkAchievements();
    if (activeTab === 'records') {
      updateRecordStats();
    } else if (activeTab === 'map') {
      // 진행 바만 제자리 갱신
      const fill = document.getElementById('stage-bar-fill');
      if (fill) {
        const goal = stageGoal(S.stage);
        const pct = Math.min(100, S.stageEarned / goal * 100);
        fill.style.width = pct + '%';
        const txt = document.getElementById('stage-progress-text');
        if (txt) txt.textContent = `이 구역에서 모은 별가루 ${fmt(S.stageEarned)} / ${fmt(goal)}`;
        const go = document.getElementById('stage-go');
        if (go) go.style.display = pct >= 100 ? '' : 'none';
      }
    } else {
      refreshShopAffordability();
      // 새 건물/업그레이드 해금 감지
      const listCount = $shopList.querySelectorAll('.item').length;
      const expect = activeTab === 'buildings' ? visibleBuildingCount() : visibleUpgradeCount();
      if (listCount !== expect) renderShop();
    }
  }

  requestAnimationFrame(loop);
}

function visibleBuildingCount() {
  let n = 0;
  for (let i = 0; i < BUILDINGS.length; i++) {
    const visible = i === 0 || S.owned[BUILDINGS[i-1].id] > 0 || S.totalEarned >= BUILDINGS[i].baseCost * 0.5;
    if (!visible) break;
    n++;
  }
  return n;
}

function visibleUpgradeCount() {
  return UPGRADES.filter(u => S.upgrades.includes(u.id) || u.unlock(S)).length;
}

function save(silent) {
  S.lastTick = Date.now();

}

function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    const base = freshState();
    S = { ...base, ...data, owned: { ...base.owned, ...(data.owned || {}) } };
    S.lifetimeEarned = Math.max(S.lifetimeEarned, S.totalEarned); // 구버전 세이브 보정
    grantOfflineReward(data.lastTick);
  } catch (e) { /* 손상된 세이브 무시 */ }
}

// 오프라인 수익 (최대 8시간, 50% 효율) — 로컬 로드·백업 복원·클라우드 불러오기 공통
function grantOfflineReward(prevTick) {
  const away = (Date.now() - (prevTick || Date.now())) / 1000;
  const sps = totalSps();
  if (away <= 60 || sps <= 0) return;
  const capped = Math.min(away, 8 * 3600);
  const reward = sps * capped * 0.5;
  earn(reward);
  const mins = Math.floor(away / 60);
  const timeStr = mins >= 60 ? `${Math.floor(mins / 60)}시간 ${mins % 60}분` : `${mins}분`;
  document.getElementById('modal-text').innerHTML =
    `자리를 비운 <b>${timeStr}</b> 동안<br>친구들이 별가루를 모아뒀어요!<br><span class="reward">✨ +${fmt(reward)}</span>`;
  document.getElementById('modal-overlay').classList.add('show');
}

});

const SAVE_PREFIX = 'STAR1.';
const $ioOverlay = document.getElementById('io-overlay');

const $ioCode = document.getElementById('io-code');

let ioMode = 'export';

function encodeSave() {
  S.lastTick = Date.now();
  const json = JSON.stringify(S);
  return SAVE_PREFIX + btoa(unescape(encodeURIComponent(json)));
}

function decodeSave(code) {
  code = code.trim();
  if (!code.startsWith(SAVE_PREFIX)) throw new Error('bad prefix');
  const json = decodeURIComponent(escape(atob(code.slice(SAVE_PREFIX.length))));
  const data = JSON.parse(json);
  if (typeof data.stardust !== 'number' || typeof data.owned !== 'object') throw new Error('bad shape');
  return data;
}

function applySave(data) {
  const base = freshState();
  const prevTick = data.lastTick;
  S = { ...base, ...data, owned: { ...base.owned, ...(data.owned || {}) } };
  S.lifetimeEarned = Math.max(S.lifetimeEarned, S.totalEarned); // 구버전 세이브 보정
  S.lastTick = Date.now();
  friendEls.forEach(el => el.remove());
  friendEls.clear();
  grantOfflineReward(prevTick);
  save(true);
  applyStageTheme();
  renderShop();
  updateStats();
}

const CLOUD_KEY = 'stardust-idle-cloud-v1';
const $cloudOverlay = document.getElementById('cloud-overlay');
const $cloudUrl = document.getElementById('cloud-url');
const $cloudUser = document.getElementById('cloud-user');
const $cloudPass = document.getElementById('cloud-pass');
const $cloudAuto = document.getElementById('cloud-auto');
const $cloudStatus = document.getElementById('cloud-status');
const $cloudUpload = document.getElementById('cloud-upload');
const $cloudDownload = document.getElementById('cloud-download');

function cloudConfig() {
  try { return JSON.parse(localStorage.getItem(CLOUD_KEY)) || {}; }
  catch (e) { return {}; }
}

function saveCloudConfig() {
  const cfg = {
    url: $cloudUrl.value.trim(),
    user: $cloudUser.value.trim(),
    pass: $cloudPass.value,
    auto: $cloudAuto.checked,
  };
  try { localStorage.setItem(CLOUD_KEY, JSON.stringify(cfg)); } catch (e) {}
  return cfg;
}

function cloudReady(cfg) {
  return cfg.url && cfg.url.startsWith('https://script.google.com/') && cfg.user && cfg.pass;
}

function cloudStatus(msg, isErr) {
  $cloudStatus.textContent = msg;
  $cloudStatus.classList.toggle('err', !!isErr);
}

const CLOUD_ERRORS = {
  not_found: '아직 이 닉네임으로 저장된 세이브가 없어요',
  wrong_pass: '비밀코드가 달라요! 다시 확인해주세요',
  bad_request: '요청이 잘못됐어요. URL을 다시 확인해주세요',
  bad_json: '요청이 잘못됐어요. URL을 다시 확인해주세요',
  too_big: '세이브가 너무 커요',
};

async function cloudSave(cfg, silent) {
  if (!cloudReady(cfg)) {
    if (!silent) cloudStatus('URL·닉네임·비밀코드를 모두 입력해주세요', true);
    return false;
  }
  if (!silent) { cloudStatus('⬆️ 저장 중…'); setCloudBusy(true); }
  try {
    const res = await fetch(cfg.url, {
      method: 'POST',
      body: JSON.stringify({ action: 'save', user: cfg.user, pass: cfg.pass, data: encodeSave() }),
    });
    const out = await res.json();
    if (!out.ok) throw new Error(out.error || 'unknown');
    if (!silent) cloudStatus('✅ 클라우드에 저장했어요!');
    return true;
  } catch (e) {
    if (!silent) cloudStatus('⚠️ ' + (CLOUD_ERRORS[e.message] || '저장 실패! 인터넷과 URL을 확인해주세요'), true);
    return false;
  } finally {
    if (!silent) setCloudBusy(false);
  }
}

async function cloudLoad(cfg) {
  if (!cloudReady(cfg)) {
    cloudStatus('URL·닉네임·비밀코드를 모두 입력해주세요', true);
    return;
  }
  cloudStatus('⬇️ 불러오는 중…');
  setCloudBusy(true);
  try {
    const qs = new URLSearchParams({ action: 'load', user: cfg.user, pass: cfg.pass });
    const res = await fetch(cfg.url + '?' + qs.toString());
    const out = await res.json();
    if (!out.ok) throw new Error(out.error || 'unknown');
    applySave(decodeSave(out.data));
    cloudStatus('✅ 세이브를 불러왔어요! 이어서 플레이하세요');
    toast('☁️ 클라우드 세이브 불러오기 완료!');
  } catch (e) {
    cloudStatus('⚠️ ' + (CLOUD_ERRORS[e.message] || '불러오기 실패! 인터넷과 URL을 확인해주세요'), true);
  } finally {
    setCloudBusy(false);
  }
}

function setCloudBusy(busy) {
  $cloudUpload.disabled = busy;
  $cloudDownload.disabled = busy;
}

document.getElementById('btn-cloud').addEventListener('click', () => {
  const cfg = cloudConfig();
  $cloudUrl.value = cfg.url || '';

  $cloudPass.value = cfg.pass || '';
  $cloudAuto.checked = !!cfg.auto;
  cloudStatus(cloudReady(cfg) ? '설정 완료! 언제든 저장/불러오기 할 수 있어요' : '');
  $cloudOverlay.classList.add('show');
